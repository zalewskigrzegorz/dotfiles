# CocoIndex Code — global settings.
# After editing this file, run `ccc doctor` to verify your configuration.

embedding:
  provider: sentence-transformers
  model: Snowflake/snowflake-arctic-embed-m-v1.5
  indexing_params: {}
  query_params:
    prompt_name: query

