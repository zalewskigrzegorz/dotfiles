# Mocha Neon for tuicr. Tokens: docs/mocha-neon-palette.md.
# *_bg tints are ~20% accent over base, text dims are derived from text/overlay.
panel_bg = "#1E1E2E"            # base
bg_highlight = "#423B6D"        # active surface (lavender @30%)
fg_primary = "#F0F0FF"          # text
fg_secondary = "#B1B1C0"        # text @70% over base
fg_dim = "#7F849C"              # overlay

diff_add = "#50FA7B"            # green
diff_add_bg = "#284A3D"
diff_del = "#FF6B9D"            # red
diff_del_bg = "#4B2D44"
diff_context = "#F0F0FF"
